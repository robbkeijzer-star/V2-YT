<!DOCTYPE html>
<html lang="en">
<head>
<script src="lock.js"></script>
<script src="/api/config"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#050506">
<title>Poop · Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="sync.js" defer></script>
<script src="topbar.js" defer></script>

<style>
:root {
  --text-primary: #FAFAFA;
  --text-secondary: #B8B6B0;
  --text-tertiary: #76746E;
  --poop: #C08552;
  --font: -apple-system, BlinkMacSystemFont, "Inter", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; background: #050506; color: var(--text-secondary);
  font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  -webkit-text-size-adjust: 100%;
}
body {
  min-height: 100vh; position: relative; overflow-x: hidden;
  padding: max(28px, env(safe-area-inset-top)) 20px 60px;
}
body::before {
  content: ''; position: fixed; inset: 0;
  background: radial-gradient(circle at 82% 14%, rgba(192,133,82,0.10), transparent 45%);
  filter: blur(40px); pointer-events: none; z-index: -2;
}
.page { max-width: 1100px; margin: 0 auto; }
.dash-title {
  margin: 0 0 14px; font-size: 28px; font-weight: 700; letter-spacing: -0.025em;
  background: linear-gradient(180deg, #FFFFFF 0%, #C7C4BC 120%);
  -webkit-background-clip: text; background-clip: text;
  -webkit-text-fill-color: transparent; color: transparent;
}
@media (max-width: 480px) { .dash-title { font-size: 22px; } }

.gm-card {
  position: relative; background: rgba(255,255,255,0.04); border-radius: 16px; padding: 20px;
  margin-bottom: 14px; backdrop-filter: blur(24px) saturate(1.2); -webkit-backdrop-filter: blur(24px) saturate(1.2);
  box-shadow: 0 12px 40px rgba(0,0,0,0.45); overflow: hidden;
}
.card-title {
  font-size: 13px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--text-primary); margin-bottom: 16px;
}

.poop-chart-wrap { width: 100%; }
.poop-chart-wrap svg { width: 100%; height: 300px; display: block; overflow: visible; }
.axis-label { font-family: var(--font-mono); font-size: 11px; fill: var(--text-tertiary); }
.day-label { font-family: var(--font); font-size: 11px; fill: var(--text-tertiary); font-weight: 600; }
.day-label .day-num { font-size: 14px; font-weight: 700; fill: var(--text-tertiary); }
.day-label.today .day-num { fill: var(--text-primary); }
.time-label { font-family: var(--font-mono); font-size: 8px; font-weight: 700; fill: var(--poop); }

.poop-actions { display: flex; gap: 10px; margin: 4px 0 14px; }
.add-poop-btn {
  flex: 1; display: block; padding: 15px;
  border: 1px solid rgba(192,133,82,0.35); border-radius: 14px;
  background: rgba(192,133,82,0.12); color: var(--text-primary);
  font-family: inherit; font-size: 15px; font-weight: 700; letter-spacing: 0.01em;
  cursor: pointer; transition: background 0.15s, transform 0.08s;
  -webkit-tap-highlight-color: transparent;
}
.add-poop-btn:active { transform: scale(0.98); background: rgba(192,133,82,0.22); }
.add-poop-btn.manual {
  background: transparent; border-color: rgba(255,255,255,0.14); color: var(--text-secondary);
}
.add-poop-btn.manual:active { background: rgba(255,255,255,0.06); }

/* ===== Manual entry modal ===== */
.modal-bg {
  position: fixed; inset: 0; z-index: 120; display: none;
  align-items: center; justify-content: center; padding: 20px;
  background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
}
.modal-bg.show { display: flex; }
.modal {
  width: 100%; max-width: 400px;
  background: #0e0e10; border: 1px solid rgba(255,255,255,0.08);
  border-radius: 18px; padding: 22px; box-shadow: 0 24px 70px rgba(0,0,0,0.6);
}
.modal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
.modal-title { font-size: 18px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; }
.modal-close { border: 0; background: transparent; color: var(--text-tertiary); font-size: 26px; line-height: 1; cursor: pointer; padding: 0 4px; }
.modal-close:hover { color: var(--text-primary); }
.field { margin-bottom: 14px; }
.field-label { font-size: 11px; font-weight: 700; letter-spacing: 0.10em; text-transform: uppercase; color: var(--text-tertiary); margin-bottom: 7px; display: block; }
.set-input {
  width: 100%; padding: 11px 13px;
  border: 1px solid rgba(255,255,255,0.08); border-radius: 11px;
  background: rgba(0,0,0,0.3); color: var(--text-primary);
  font-family: inherit; font-size: 14px; outline: none; transition: border-color 0.2s;
}
.set-input:focus { border-color: rgba(255,255,255,0.28); }
.set-save {
  width: 100%; margin-top: 6px; padding: 13px; border: 0; border-radius: 12px;
  background: linear-gradient(180deg,#FFFFFF,#E8E5DD); color: #0A0A0B;
  font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer;
  box-shadow: inset 0 1px 0 rgba(255,255,255,0.9), 0 8px 22px rgba(0,0,0,0.25);
  transition: filter 0.15s, transform 0.1s;
}
.set-save:active { transform: translateY(1px); }

.today-list { display: flex; flex-direction: column; gap: 8px; }
.today-empty { font-size: 13px; color: var(--text-tertiary); padding: 4px 0; }
.entry-row {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 14px; border-radius: 11px; background: rgba(255,255,255,0.03);
  border: 1px solid rgba(255,255,255,0.06);
}
.entry-time { font-family: var(--font-mono); font-size: 14px; font-weight: 700; color: var(--text-primary); }
.entry-del {
  width: 26px; height: 26px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.12);
  background: transparent; color: var(--text-tertiary); font-size: 14px; line-height: 1;
  cursor: pointer; -webkit-tap-highlight-color: transparent;
}
.entry-del:active { background: rgba(255,255,255,0.08); }
</style>
</head>
<body>
<div class="page">

  <h1 class="dash-title">Poop Tracker</h1>

  <div class="gm-card">
    <div class="card-title">Weekly Log</div>
    <div class="poop-chart-wrap">
      <svg id="poopChart" viewBox="0 0 640 300" preserveAspectRatio="none"></svg>
    </div>
  </div>

  <div class="poop-actions">
    <button id="manualPoopBtn" class="add-poop-btn manual" type="button">+ Manual Poop</button>
    <button id="addPoopBtn" class="add-poop-btn" type="button">+ Add Poop</button>
  </div>

  <div class="gm-card">
    <div class="card-title">Today</div>
    <div id="todayList" class="today-list"></div>
  </div>

</div>

<!-- ===== Manual entry modal ===== -->
<div class="modal-bg" id="manualBg">
  <div class="modal" role="dialog" aria-label="Manual poop entry">
    <div class="modal-head">
      <span class="modal-title">Manual Entry</span>
      <button class="modal-close" id="manualClose" type="button" aria-label="Close">×</button>
    </div>
    <div class="field">
      <label class="field-label">Date</label>
      <input type="date" id="manualDate" class="set-input">
    </div>
    <div class="field">
      <label class="field-label">Time</label>
      <input type="time" id="manualTime" class="set-input">
    </div>
    <button id="manualSave" class="set-save" type="button">Save</button>
  </div>
</div>

<script>
(function () {
  'use strict';
  const KEY = 'poop_v1';

  function load() { try { return JSON.parse(localStorage.getItem(KEY)) || { entries: [] }; } catch (e) { return { entries: [] }; } }
  function save(state) { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} }

  let state = load();

  function dayKey(d) {
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fmtTime(d) {
    let h = d.getHours(), m = d.getMinutes();
    const ampm = h >= 12 ? 'PM' : 'AM';
    h = h % 12; if (h === 0) h = 12;
    return h + ':' + String(m).padStart(2, '0') + ' ' + ampm;
  }

  function last7Days() {
    const days = [];
    const today = new Date();
    for (let i = 6; i >= 0; i--) {
      const d = new Date(today);
      d.setDate(d.getDate() - i);
      days.push(d);
    }
    return days;
  }

  function addPoop() {
    state.entries.push(new Date().toISOString());
    save(state);
    render();
  }

  function addManualPoop(dateStr, timeStr) {
    if (!dateStr || !timeStr) return;
    const [y, mo, da] = dateStr.split('-').map(Number);
    const [h, mi] = timeStr.split(':').map(Number);
    const d = new Date(y, mo - 1, da, h, mi, 0, 0);
    state.entries.push(d.toISOString());
    save(state);
    render();
  }

  function pad2(n) { return String(n).padStart(2, '0'); }

  function openManualModal() {
    const now = new Date();
    document.getElementById('manualDate').value =
      now.getFullYear() + '-' + pad2(now.getMonth() + 1) + '-' + pad2(now.getDate());
    document.getElementById('manualTime').value = pad2(now.getHours()) + ':' + pad2(now.getMinutes());
    document.getElementById('manualBg').classList.add('show');
  }

  function closeManualModal() {
    document.getElementById('manualBg').classList.remove('show');
  }

  function deleteEntry(iso) {
    state.entries = state.entries.filter((e) => e !== iso);
    save(state);
    render();
  }

  function renderChart() {
    const svg = document.getElementById('poopChart');
    const H = 300, padT = 20, padB = 46, padL = 34, padR = 10;
    const W = Math.max(320, svg.parentElement.clientWidth || 640);
    svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
    const chartW = W - padL - padR, chartH = H - padT - padB;
    const days = last7Days();
    const colW = chartW / 7;
    const todayKey = dayKey(new Date());

    const START_MIN = 7 * 60, END_MIN = 24 * 60, RANGE_MIN = END_MIN - START_MIN;
    const X = (i) => padL + colW * i + colW / 2;
    const Y = (mins) => {
      const clamped = Math.min(END_MIN, Math.max(START_MIN, mins));
      return padT + chartH - ((clamped - START_MIN) / RANGE_MIN) * chartH;
    };

    let parts = [];

    // highlight today's column
    const todayIdx = 6;
    parts.push('<rect x="' + (padL + colW * todayIdx).toFixed(1) + '" y="' + padT + '" width="' + colW.toFixed(1) + '" height="' + chartH + '" fill="rgba(255,255,255,0.05)"/>');

    // gridlines + hour labels (7am — 12am)
    const hourMarks = [7, 10, 13, 16, 19, 22, 24];
    const hourText = ['7 AM', '10 AM', '1 PM', '4 PM', '7 PM', '10 PM', '12 AM'];
    hourMarks.forEach((hh, i) => {
      const y = Y(hh * 60);
      parts.push('<line x1="' + padL + '" y1="' + y.toFixed(1) + '" x2="' + (W - padR) + '" y2="' + y.toFixed(1) + '" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>');
      parts.push('<text class="axis-label" x="0" y="' + (y + 4).toFixed(1) + '">' + hourText[i] + '</text>');
    });

    // day labels — weekday on top, date number below (like the WHOOP chart)
    days.forEach((d, i) => {
      const key = dayKey(d);
      const cls = key === todayKey ? 'day-label today' : 'day-label';
      const wk = d.toLocaleDateString(undefined, { weekday: 'short' });
      const x = X(i).toFixed(1);
      parts.push('<text class="' + cls + '" x="' + x + '" y="' + (H - 30) + '" text-anchor="middle">' + wk
        + '<tspan class="day-num" x="' + x + '" dy="17">' + d.getDate() + '</tspan></text>');
    });

    // dots per entry
    const byDay = {};
    state.entries.forEach((iso) => {
      const d = new Date(iso);
      const key = dayKey(d);
      (byDay[key] = byDay[key] || []).push(d);
    });

    days.forEach((day, i) => {
      const key = dayKey(day);
      const list = byDay[key] || [];
      list.sort((a, b) => a - b);
      list.forEach((d, j) => {
        const mins = d.getHours() * 60 + d.getMinutes();
        const x = X(i), y = Y(mins);
        const labelUp = j % 2 === 0;
        const ly = labelUp ? y - 16 : y + 26;
        parts.push('<text x="' + x.toFixed(1) + '" y="' + (y + 6).toFixed(1) + '" text-anchor="middle" font-size="18">💩</text>');
        parts.push('<text class="time-label" x="' + x.toFixed(1) + '" y="' + ly.toFixed(1) + '" text-anchor="middle">' + fmtTime(d) + '</text>');
      });
    });

    svg.innerHTML = parts.join('');
  }

  function renderTodayList() {
    const el = document.getElementById('todayList');
    const todayKey = dayKey(new Date());
    const list = state.entries
      .filter((iso) => dayKey(new Date(iso)) === todayKey)
      .sort((a, b) => new Date(a) - new Date(b));

    if (!list.length) {
      el.innerHTML = '<div class="today-empty">No entries yet today.</div>';
      return;
    }

    el.innerHTML = list.map((iso) => {
      const d = new Date(iso);
      return '<div class="entry-row"><span class="entry-time">' + fmtTime(d) + '</span>'
        + '<button class="entry-del" data-iso="' + iso + '" type="button" aria-label="Delete">×</button></div>';
    }).join('');

    el.querySelectorAll('.entry-del').forEach((btn) => {
      btn.addEventListener('click', () => deleteEntry(btn.dataset.iso));
    });
  }

  function render() {
    renderChart();
    renderTodayList();
  }

  document.getElementById('addPoopBtn').addEventListener('click', addPoop);
  document.getElementById('manualPoopBtn').addEventListener('click', openManualModal);
  document.getElementById('manualClose').addEventListener('click', closeManualModal);
  document.getElementById('manualBg').addEventListener('click', (e) => {
    if (e.target.id === 'manualBg') closeManualModal();
  });
  document.getElementById('manualSave').addEventListener('click', () => {
    const dateStr = document.getElementById('manualDate').value;
    const timeStr = document.getElementById('manualTime').value;
    addManualPoop(dateStr, timeStr);
    closeManualModal();
  });

  window.addEventListener('resize', renderChart);
  render();
})();
</script>
</body>
</html>
